<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon - The Apocrypha</title>
<style>
:root {
  --bg-color: #0f172a; --card-bg: #1e293b; --accent-gold: #f59e0b; --accent-blue: #38bdf8;
  --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 24px; display: flex; flex-direction: column; align-items: center; font-size: 1.06rem; min-height: 100vh; }
.container { width: 100%; max-width: 640px; margin: auto 0; }
.top-nav { width: 100%; margin-bottom: 20px; }
.back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-gold); text-decoration: none; font-weight: 600; background: var(--card-bg); padding: 10px 18px; border-radius: 20px; border: 1px solid var(--border-color); }
.back-btn:hover, .back-btn:focus-visible { background: var(--accent-gold); color: #000; }
.stub-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px 32px; text-align: center; }
.stub-icon { font-size: 2.6rem; margin-bottom: 14px; }
.stub-tag { color: var(--accent-blue); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.stub-badge { display: inline-block; background: rgba(245,158,11,0.15); color: var(--accent-gold); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 14px; border-radius: 20px; margin-bottom: 16px; }
.stub-title { font-family: var(--font-display); color: var(--accent-gold); font-size: 2rem; margin: 0 0 14px 0; }
.stub-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 4px; }
@media (max-width: 480px) { .stub-title { font-size: 1.6rem; } body { padding: 14px; } .stub-card { padding: 30px 20px; } }
</style>
<link rel="stylesheet" href="../lib/hub-ui.css">
</head>
<body>
<div class="container">
<div class="top-nav"><a href="index.html" class="back-btn">⬅️ Back to Apocrypha</a></div>
<div class="stub-card">
<div class="stub-icon">📖</div>
<div class="stub-tag" id="stubTag">The Apocrypha</div>
<div class="stub-badge">Coming Soon</div>
<h1 class="stub-title" id="stubTitle">This book</h1>
<p class="stub-desc" id="stubDesc">This book hasn't been built out yet. Check back after a future update.</p>
</div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var book = params.get('book');
  var group = params.get('group');
  var desc = params.get('desc');
  if (book) {
    document.title = book + ' - Coming Soon';
    document.getElementById('stubTitle').textContent = book;
  }
  if (group) {
    document.getElementById('stubTag').textContent = group;
  }
  if (desc) {
    document.getElementById('stubDesc').textContent = desc;
  }
})();
</script>
<script src="../data/passage-data.js"></script>
<script src="../lib/hub-ui.js"></script>
<script src="../lib/hub-modules.js"></script>
</body>
</html>
